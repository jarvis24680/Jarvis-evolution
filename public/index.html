<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jarvis</title>
<meta name="theme-color" content="#0F1424" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jarvis" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0F1424; }
  body { font-family: 'Inter', -apple-system, sans-serif; color: #EDE6D6; overflow: hidden; }
  #root { height: 100vh; height: 100dvh; }
  ::selection { background: rgba(201,162,39,0.35); }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(201,162,39,0.25); border-radius: 3px; }
  textarea:focus, button:focus-visible { outline: 2px solid #C9A227; outline-offset: 2px; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(193,81,45,0.35); } 50% { box-shadow: 0 0 0 6px rgba(193,81,45,0); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="root">
  <div style="color:white;padding:30px;font-family:Arial">
    Loading JARVIS...
  </div>
</div>

<script>
window.onerror = function(message, source, line, column, error) {
  document.getElementById("root").innerHTML =
    '<div style="color:#ff6b6b;padding:30px;font-family:Arial">' +
    '<h2>JARVIS startup error</h2>' +
    '<p>' + message + '</p>' +
    '<p>Line: ' + line + '</p>' +
    '</div>';
};
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY = "jarvis:session-v1";
const MAX_INPUT_CHARS = 6000;
const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
const ALLOWED_IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif"];
const MAX_MEMORY_ITEMS = 60;
const MAX_HISTORY = 100;

const SYSTEM_PROMPT = `You are Jarvis, a general-purpose personal assistant built for one user.
Your job: accumulate useful context about the user's goals and projects over time, and give
answers that are precise but not bloated. Adapt explanation depth to what's asked — quick
when a quick answer is wanted, a full teaching pass when the user wants to actually learn.

Rules:
- Be direct. No filler preambles.
- When you use web search, summarize findings in plain language, don't dump raw links.
- When the user shares something durable worth remembering (a project, a goal, a
  preference), end your reply with a line starting exactly with "MEMORY:" followed by a
  short third-person fact. Only include it when something is genuinely worth keeping.
- You do not have unlimited capability and you're honest about that — but be maximally
  useful, thorough when warranted, and willing to go deep on any subject.`;

function useWindowSize() {
  const [w, setW] = useState(window.innerWidth);
  useEffect(() => {
    const onResize = () => setW(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return w;
}

function GrowthRing({ count }) {
  const angle = Math.min(100, count * 6) * 3.6;
  return (
    <div style={{ width: 46, height: 46, borderRadius: "50%",
      background: `conic-gradient(#C9A227 ${angle}deg, rgba(201,162,39,0.12) ${angle}deg)`,
      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      <div style={{ width: 36, height: 36, borderRadius: "50%", background: "#0F1424",
        display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#C9A227" }}>
        {count}
      </div>
    </div>
  );
}

// Minimal inline icon set (no external icon library dependency)
const Icon = ({ path, size = 17 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {path}
  </svg>
);
const SendIcon = (p) => <Icon {...p} path={<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />} />;
const MicIcon = (p) => <Icon {...p} path={<><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8" /></>} />;
const MicOffIcon = (p) => <Icon {...p} path={<><path d="m1 1 22 22" /><path d="M9 9v3a3 3 0 0 0 4.6 2.5M15 9V5a3 3 0 0 0-5.9-.8" /><path d="M19 10v1a7 7 0 0 1-.98 3.6M12 18v4M8 22h8" /></>} />;
const ImgIcon = (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></>} />;
const GlobeIcon = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20Z" /></>} />;
const VolIcon = (p) => <Icon {...p} path={<><path d="M11 5 6 9H2v6h4l5 4V5Z" /><path d="M19 5a10 10 0 0 1 0 14M15.5 8.5a5 5 0 0 1 0 7" /></>} />;
const VolOffIcon = (p) => <Icon {...p} path={<><path d="M11 5 6 9H2v6h4l5 4V5Z" /><path d="m22 9-6 6M16 9l6 6" /></>} />;
const BookIcon = (p) => <Icon {...p} path={<><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" /></>} />;
const XIcon = (p) => <Icon {...p} path={<path d="M18 6 6 18M6 6l12 12" />} />;
const CompassIcon = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12Z" /></>} />;
const SparkIcon = (p) => <Icon {...p} path={<path d="M12 2 9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5L12 2Z" />} />;
const TrashIcon = (p) => <Icon {...p} path={<><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6" /></>} />;

function Jarvis() {
  const [messages, setMessages] = useState([]);
  const [memory, setMemory] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [useWeb, setUseWeb] = useState(true);
  const [depth, setDepth] = useState("auto");
  const [showMemory, setShowMemory] = useState(false);
  const [voiceOn, setVoiceOn] = useState(false);
  const [listening, setListening] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [voiceSupport, setVoiceSupport] = useState({ tts: false, stt: false });
  const [attachedImage, setAttachedImage] = useState(null);
  const [attachError, setAttachError] = useState("");
  const [errorBanner, setErrorBanner] = useState("");
  const scrollRef = useRef(null);
  const recognitionRef = useRef(null);
  const chosenVoiceRef = useRef(null);
  const fileInputRef = useRef(null);
  const width = useWindowSize();
  const isMobile = width < 780;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        setMessages(data.messages || []);
        setMemory(data.memory || []);
      }
    } catch (e) {}

    const tts = "speechSynthesis" in window;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    setVoiceSupport({ tts, stt: !!SR });

    if (tts) {
      const pickVoice = () => {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        const priority = [
          v => /Google UK English Male/i.test(v.name),
          v => /Daniel/i.test(v.name),
          v => /Microsoft (Ryan|Guy)/i.test(v.name),
          v => /Google US English/i.test(v.name),
          v => v.lang?.startsWith("en") && /male/i.test(v.name),
          v => v.lang?.startsWith("en"),
        ];
        for (const test of priority) {
          const m = voices.find(test);
          if (m) { chosenVoiceRef.current = m; return; }
        }
        chosenVoiceRef.current = voices[0];
      };
      pickVoice();
      window.speechSynthesis.onvoiceschanged = pickVoice;
    }

    if (SR) {
      const rec = new SR();
      rec.continuous = false;
      rec.interimResults = false;
      rec.lang = "en-US";
      rec.onresult = (e) => {
        const t = e.results[0][0].transcript;
        setInput(prev => prev ? prev + " " + t : t);
      };
      rec.onend = () => setListening(false);
      rec.onerror = () => setListening(false);
      recognitionRef.current = rec;
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  }, []);

  useEffect(() => {
    try {
      const trimmed = messages.slice(-MAX_HISTORY).map(({ apiContent, imagePreview, ...rest }) => ({
        ...rest, hadImage: !!imagePreview,
      }));
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ messages: trimmed, memory }));
    } catch (e) {}
  }, [messages, memory]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  const depthInstruction = {
    auto: "",
    simple: "\n\nFor this message: keep it short and simple, plain language, minimal jargon.",
    deep: "\n\nFor this message: go deep — full explanation, build from fundamentals, use examples.",
  }[depth];

  const speak = useCallback((text) => {
    if (!voiceSupport.tts || !text) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[*_#`]/g, "").replace(/\n{2,}/g, ". ");
    const u = new SpeechSynthesisUtterance(clean);
    if (chosenVoiceRef.current) u.voice = chosenVoiceRef.current;
    u.rate = 1.0; u.pitch = 0.92;
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    window.speechSynthesis.speak(u);
  }, [voiceSupport.tts]);

  const toggleListening = useCallback(() => {
    if (!recognitionRef.current) return;
    if (listening) {
      recognitionRef.current.stop();
      setListening(false);
    } else {
      window.speechSynthesis.cancel();
      setSpeaking(false);
      try { recognitionRef.current.start(); setListening(true); } catch (e) {}
    }
  }, [listening]);

  const handleFileSelect = useCallback((e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setAttachError("");
    if (!ALLOWED_IMAGE_TYPES.includes(file.type)) {
      setAttachError("Unsupported file type — use PNG, JPEG, WEBP, or GIF.");
      return;
    }
    if (file.size > MAX_IMAGE_BYTES) {
      setAttachError("Image is too large — 5MB max.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      setAttachedImage({ dataUrl, mediaType: file.type, base64: dataUrl.split(",")[1] });
    };
    reader.onerror = () => setAttachError("Couldn't read that file — try again.");
    reader.readAsDataURL(file);
  }, []);

  const sendMessage = useCallback(async () => {
    const text = input.trim().slice(0, MAX_INPUT_CHARS);
    if ((!text && !attachedImage) || loading) return;
    setErrorBanner("");

    const content = [];
    if (attachedImage) {
      content.push({ type: "image", source: { type: "base64", media_type: attachedImage.mediaType, data: attachedImage.base64 } });
    }
    content.push({ type: "text", text: text || "What's in this image?" });

    const newUserMsg = { role: "user", content: text || "(image)", imagePreview: attachedImage?.dataUrl || null, apiContent: content };
    const updated = [...messages, newUserMsg];
    setMessages(updated);
    setInput("");
    setAttachedImage(null);
    setAttachError("");
    setLoading(true);

    try {
      const memoryBlock = memory.length > 0
        ? `\n\nWhat you already know about the user:\n${memory.map(m => `- ${m}`).join("\n")}`
        : "";

      const apiMessages = updated.map((m, i) => ({
        role: m.role,
        content: (i === updated.length - 1 && m.apiContent) ? m.apiContent : m.content,
      }));

      const body = {
        system: SYSTEM_PROMPT + memoryBlock + depthInstruction,
        messages: apiMessages,
      };
      if (useWeb) body.tools = [{ type: "web_search_20250305", name: "web_search" }];

      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      if (response.status === 429) {
        setErrorBanner("You're sending messages a bit fast — give it a few seconds.");
        setLoading(false);
        return;
      }
      if (!response.ok) throw new Error("bad status");
      const data = await response.json();

      const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n\n");
      const usedSearch = (data.content || []).some(b => b.type === "server_tool_use" || b.type === "web_search_tool_result");

      let replyText = textBlocks || "(no response)";
      let newMemoryLine = null;
      const memMatch = replyText.match(/\nMEMORY:\s*(.+)$/);
      if (memMatch) {
        newMemoryLine = memMatch[1].trim();
        replyText = replyText.replace(/\nMEMORY:\s*(.+)$/, "").trim();
      }

      setMessages(prev => [...prev, { role: "assistant", content: replyText, searched: usedSearch }]);
      if (newMemoryLine) {
        setMemory(prev => {
          const next = [...prev, newMemoryLine];
          return next.length > MAX_MEMORY_ITEMS ? next.slice(next.length - MAX_MEMORY_ITEMS) : next;
        });
      }
      if (voiceOn) speak(replyText);
    } catch (e) {
      setMessages(prev => [...prev, { role: "assistant", content: "Something went wrong reaching the server — check your connection and try again.", error: true }]);
    } finally {
      setLoading(false);
    }
  }, [input, loading, messages, memory, useWeb, depthInstruction, voiceOn, speak, attachedImage]);

  const clearMemory = () => setMemory([]);
  const clearAll = () => { setMessages([]); setMemory([]); try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} };

  return (
    <div style={{ height: "100%", background: "#0F1424", color: "#EDE6D6", display: "flex", flexDirection: isMobile ? "column" : "row" }}>
      <aside style={{
        width: isMobile ? "100%" : 280,
        borderRight: isMobile ? "none" : "1px solid rgba(201,162,39,0.15)",
        borderBottom: isMobile ? "1px solid rgba(201,162,39,0.15)" : "none",
        padding: "20px 22px", display: "flex",
        flexDirection: isMobile ? "row" : "column",
        alignItems: isMobile ? "center" : "stretch",
        justifyContent: isMobile ? "space-between" : "flex-start", gap: 18,
        overflowY: isMobile ? "visible" : "auto",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <GrowthRing count={memory.length} />
          <div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: 21, fontWeight: 600 }}>Jarvis</div>
            {!isMobile && <div style={{ fontSize: 12, color: "#8892B0", fontFamily: "'IBM Plex Mono', monospace" }}>
              {speaking ? "speaking…" : `${memory.length} thing${memory.length === 1 ? "" : "s"} remembered`}
            </div>}
          </div>
        </div>

        {!isMobile && <>
          <div style={{ height: 1, background: "rgba(201,162,39,0.15)" }} />
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <div style={{ fontSize: 11, letterSpacing: "0.08em", color: "#8892B0", textTransform: "uppercase", fontFamily: "'IBM Plex Mono', monospace" }}>Explanation depth</div>
            {[{ id: "auto", label: "Auto" }, { id: "simple", label: "Keep it simple" }, { id: "deep", label: "Go deep" }].map(opt => (
              <button key={opt.id} onClick={() => setDepth(opt.id)} style={{
                textAlign: "left", padding: "9px 12px", borderRadius: 8,
                border: "1px solid " + (depth === opt.id ? "#C9A227" : "rgba(201,162,39,0.15)"),
                background: depth === opt.id ? "rgba(201,162,39,0.12)" : "transparent",
                color: depth === opt.id ? "#EDE6D6" : "#8892B0", cursor: "pointer", fontSize: 13.5,
              }}>{opt.label}</button>
            ))}
          </div>
          <div style={{ height: 1, background: "rgba(201,162,39,0.15)" }} />
          <button onClick={() => setUseWeb(v => !v)} style={{
            display: "flex", alignItems: "center", gap: 9, padding: "9px 12px", borderRadius: 8,
            border: "1px solid " + (useWeb ? "#C9A227" : "rgba(201,162,39,0.15)"),
            background: useWeb ? "rgba(201,162,39,0.12)" : "transparent",
            color: useWeb ? "#EDE6D6" : "#8892B0", cursor: "pointer", fontSize: 13.5,
          }}><GlobeIcon size={15} /> Web search {useWeb ? "on" : "off"}</button>

          {voiceSupport.tts && <button onClick={() => { if (voiceOn) window.speechSynthesis.cancel(); setSpeaking(false); setVoiceOn(v => !v); }} style={{
            display: "flex", alignItems: "center", gap: 9, padding: "9px 12px", borderRadius: 8,
            border: "1px solid " + (voiceOn ? "#C9A227" : "rgba(201,162,39,0.15)"),
            background: voiceOn ? "rgba(201,162,39,0.12)" : "transparent",
            color: voiceOn ? "#EDE6D6" : "#8892B0", cursor: "pointer", fontSize: 13.5,
          }}>{voiceOn ? <VolIcon size={15} /> : <VolOffIcon size={15} />} Voice replies {voiceOn ? "on" : "off"}</button>}

          <button onClick={() => setShowMemory(v => !v)} style={{
            display: "flex", alignItems: "center", gap: 9, padding: "9px 12px", borderRadius: 8,
            border: "1px solid rgba(201,162,39,0.15)", background: "transparent",
            color: "#8892B0", cursor: "pointer", fontSize: 13.5,
          }}><BookIcon size={15} /> {showMemory ? "Hide" : "Show"} memory</button>

          {showMemory && <div style={{ maxHeight: 200, overflowY: "auto", display: "flex", flexDirection: "column", gap: 6 }} className="scroll">
            {memory.length === 0 && <div style={{ fontSize: 12.5, color: "#556", fontStyle: "italic" }}>Nothing stored yet.</div>}
            {memory.map((m, i) => (
              <div key={i} style={{ fontSize: 12.5, color: "#B8BFD6", padding: "6px 8px", background: "rgba(255,255,255,0.03)", borderRadius: 6, borderLeft: "2px solid #C9A227" }}>{m}</div>
            ))}
            {memory.length > 0 && <button onClick={clearMemory} style={{ marginTop: 4, display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#C1512D", background: "none", border: "none", cursor: "pointer" }}><TrashIcon size={12} /> Clear memory</button>}
          </div>}

          <div style={{ flex: 1 }} />
          <button onClick={clearAll} style={{ fontSize: 12, color: "#556", background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>Reset session</button>
        </>}
      </aside>

      <main style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>
        <div ref={scrollRef} className="scroll" style={{ flex: 1, overflowY: "auto", padding: isMobile ? "18px 14px" : "32px 44px", display: "flex", flexDirection: "column", gap: 20 }}>
          {messages.length === 0 && (
            <div style={{ margin: "auto", textAlign: "center", maxWidth: 420, color: "#8892B0" }}>
              <CompassIcon size={26} style={{ color: "#C9A227", marginBottom: 12 }} />
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, color: "#EDE6D6", marginBottom: 8 }}>Ask anything. I'll adapt as I go.</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.6 }}>Search the web, attach a photo, talk with your voice, or just type — I'll hold onto what matters.</div>
            </div>
          )}
          {messages.map((m, i) => (
            <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
              <div style={{
                maxWidth: isMobile ? "88%" : "68%", padding: "12px 15px", borderRadius: 14, fontSize: 14.5, lineHeight: 1.6, whiteSpace: "pre-wrap",
                background: m.role === "user" ? "rgba(201,162,39,0.14)" : m.error ? "rgba(193,81,45,0.12)" : "rgba(255,255,255,0.04)",
                border: "1px solid " + (m.role === "user" ? "rgba(201,162,39,0.25)" : "rgba(255,255,255,0.06)"),
                color: m.error ? "#E0A38A" : "#EDE6D6",
              }}>
                {m.imagePreview && <img src={m.imagePreview} alt="Attached" style={{ maxWidth: "100%", maxHeight: 220, borderRadius: 8, marginBottom: 8, display: "block" }} />}
                {m.role === "assistant" && m.searched && <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10.5, color: "#8892B0", marginBottom: 6, fontFamily: "'IBM Plex Mono', monospace", textTransform: "uppercase" }}><GlobeIcon size={11} /> searched the web</div>}
                {m.content}
              </div>
            </div>
          ))}
          {loading && <div style={{ display: "flex", justifyContent: "flex-start" }}>
            <div style={{ padding: "12px 15px", borderRadius: 14, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)", color: "#8892B0", fontSize: 13.5, display: "flex", alignItems: "center", gap: 8 }}>
              <SparkIcon size={14} style={{ color: "#C9A227" }} /> thinking…
            </div>
          </div>}
        </div>

        <div style={{ padding: isMobile ? "10px 14px 16px" : "14px 44px 24px", borderTop: "1px solid rgba(201,162,39,0.12)" }}>
          {errorBanner && <div style={{ fontSize: 12.5, color: "#E0A38A", marginBottom: 8 }}>{errorBanner}</div>}
          {isMobile && <div style={{ display: "flex", gap: 8, marginBottom: 10, overflowX: "auto" }}>
            <button onClick={() => setUseWeb(v => !v)} style={{ display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 20, border: "1px solid " + (useWeb ? "#C9A227" : "rgba(201,162,39,0.2)"), background: useWeb ? "rgba(201,162,39,0.12)" : "transparent", color: useWeb ? "#EDE6D6" : "#8892B0", fontSize: 12, whiteSpace: "nowrap" }}><GlobeIcon size={12} /> Web {useWeb ? "on" : "off"}</button>
            {voiceSupport.tts && <button onClick={() => setVoiceOn(v => !v)} style={{ display: "flex", alignItems: "center", gap: 5, padding: "6px 10px", borderRadius: 20, border: "1px solid " + (voiceOn ? "#C9A227" : "rgba(201,162,39,0.2)"), background: voiceOn ? "rgba(201,162,39,0.12)" : "transparent", color: voiceOn ? "#EDE6D6" : "#8892B0", fontSize: 12, whiteSpace: "nowrap" }}><VolIcon size={12} /> Voice {voiceOn ? "on" : "off"}</button>}
            {["auto", "simple", "deep"].map(d => (
              <button key={d} onClick={() => setDepth(d)} style={{ padding: "6px 10px", borderRadius: 20, border: "1px solid " + (depth === d ? "#C9A227" : "rgba(201,162,39,0.2)"), background: depth === d ? "rgba(201,162,39,0.12)" : "transparent", color: depth === d ? "#EDE6D6" : "#8892B0", fontSize: 12, whiteSpace: "nowrap", textTransform: "capitalize" }}>{d}</button>
            ))}
          </div>}

          {attachedImage && <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
            <div style={{ position: "relative" }}>
              <img src={attachedImage.dataUrl} alt="To send" style={{ width: 52, height: 52, objectFit: "cover", borderRadius: 8, border: "1px solid rgba(201,162,39,0.3)" }} />
              <button onClick={() => setAttachedImage(null)} style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", background: "#C1512D", border: "none", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><XIcon size={12} /></button>
            </div>
            <div style={{ fontSize: 12, color: "#8892B0" }}>Image attached — add a note or just send</div>
          </div>}
          {attachError && <div style={{ fontSize: 12, color: "#E0A38A", marginBottom: 8 }}>{attachError}</div>}

          <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
            <input ref={fileInputRef} type="file" accept={ALLOWED_IMAGE_TYPES.join(",")} onChange={handleFileSelect} style={{ display: "none" }} />
            <button onClick={() => fileInputRef.current?.click()} title="Attach an image" style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (attachedImage ? "#C9A227" : "rgba(201,162,39,0.2)"), background: attachedImage ? "rgba(201,162,39,0.12)" : "rgba(255,255,255,0.04)", color: attachedImage ? "#EDE6D6" : "#8892B0", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}><ImgIcon size={17} /></button>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              placeholder={attachedImage ? "Add a note (optional)…" : "Ask Jarvis anything…"}
              rows={1} maxLength={MAX_INPUT_CHARS}
              style={{ flex: 1, resize: "none", background: "rgba(255,255,255,0.04)", border: "1px solid rgba(201,162,39,0.2)", borderRadius: 12, padding: "12px 14px", color: "#EDE6D6", fontSize: 14.5, fontFamily: "'Inter', sans-serif", maxHeight: 140 }}
            />
            {voiceSupport.stt && <button onClick={toggleListening} title={listening ? "Stop listening" : "Speak to Jarvis"} style={{ width: 42, height: 42, borderRadius: 10, border: "1px solid " + (listening ? "#C1512D" : "rgba(201,162,39,0.2)"), background: listening ? "rgba(193,81,45,0.15)" : "rgba(255,255,255,0.04)", color: listening ? "#E0A38A" : "#8892B0", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, animation: listening ? "pulse 1.2s infinite" : "none" }}>{listening ? <MicOffIcon size={17} /> : <MicIcon size={17} />}</button>}
            <button onClick={sendMessage} disabled={loading || (!input.trim() && !attachedImage)} style={{ width: 42, height: 42, borderRadius: 10, border: "none", background: (loading || (!input.trim() && !attachedImage)) ? "rgba(201,162,39,0.25)" : "#C9A227", color: "#0F1424", display: "flex", alignItems: "center", justifyContent: "center", cursor: (loading || (!input.trim() && !attachedImage)) ? "default" : "pointer", flexShrink: 0 }}><SendIcon size={17} /></button>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Jarvis />);
</script>
<section id="jarvis-gemini-controls" style="margin:12px;padding:14px;border:1px solid #444;border-radius:14px"><b>JARVIS</b><br><button id="evolve">🧬 Evolve</button><button id="talk">🎙️ Talk</button><input id="photo" type="file" accept="image/*" capture="environment" hidden><button id="photoBtn">📷 Photo</button><pre id="status" style="white-space:pre-wrap"></pre></section><script>(()=>{const b=window.JARVIS_API_BASE_URL||"";const s=m=>document.getElementById("status").textContent=m;document.getElementById("evolve")?.addEventListener("click",async()=>{let g=prompt("What should JARVIS improve?");if(!g)return;s("Analyzing...");let r=await fetch(b+"/api/evolve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({goal:g})});let d=await r.json();s(d.proposal||d.error||"No result");});document.getElementById("talk")?.addEventListener("click",()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return s("Speech recognition unavailable");let r=new R();r.lang="en-GB";r.onresult=e=>{let t=e.results[0][0].transcript;let x=document.querySelector("textarea,input[type=text]");if(x){x.value=t;x.dispatchEvent(new Event("input",{bubbles:true}));x.focus();}s("Heard: "+t)};r.start();});document.getElementById("photoBtn")?.addEventListener("click",()=>document.getElementById("photo").click());document.getElementById("photo")?.addEventListener("change",e=>{if(e.target.files?.[0])s("Photo selected. Send it through the chat image input.");});})();</script></body>
</html>
